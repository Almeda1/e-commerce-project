<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';
      background-color: #f9fafb;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .card {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .logo {
      font-family: 'Playfair Display', 'Didot', 'Georgia', serif;
      font-size: 28px;
      color: #111827;
      margin-bottom: 24px;
      letter-spacing: 0.15em;
    }
    h1 {
      color: #111827;
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 16px;
    }
    p {
      color: #4b5563;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background-color: #111827;
      color: #ffffff !important;
      text-decoration: none;
      padding: 16px 32px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      border-radius: 4px;
      margin-bottom: 32px;
    }
    .footer {
      text-align: center;
      margin-top: 32px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">ÉCLAT</div>
      <h1>Verify your email address</h1>
      <p>Welcome to our exclusive collection. Please confirm your email address to activate your account and start exploring the world's finest luxury timepieces.</p>
      <!-- {{ .ConfirmationURL }} is the Supabase template variable -->
      <a href="{{ .ConfirmationURL }}" class="btn">Confirm Email</a>
      <p style="font-size: 14px; margin-bottom: 0;">This link will expire in 24 hours.</p>
    </div>
    <div class="footer">
      <p>&copy; 2024 Swiss Precision. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
